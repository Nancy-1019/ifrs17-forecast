# ================================================================
# IFRS17 预测模型系统 — 宝塔面板 Nginx 配置（修正版）
# 
# 使用方法：
#   宝塔面板 → 网站 → ifrs17-system → 设置 → 配置文件
#   用本文件内容替换原有配置（注意保留宝塔自动生成的标记段）
# ================================================================

server {
    listen 80;
    # server_name 写实际域名或 IP；未备案域名用 _ 通配
    server_name ifrs17_backend.com;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/ifrs17-system;

    include /www/server/panel/vhost/nginx/extension/ifrs17-system/*.conf;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/ifrs17-system.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  错误页相关配置
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START 伪静态相关配置
    include /www/server/panel/vhost/rewrite/python_ifrs17-system.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$ {
        return 404;
    }
    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }
    #一键申请SSL证书验证目录相关设置
    location /.well-known/ {
        root /www/wwwroot/java_node_ssl;
    }
    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ===== IFRS17 自定义配置 =====

    # 上传文件大小限制（50MB，与 Django DATA_UPLOAD_MAX_MEMORY_SIZE 一致）
    client_max_body_size 50M;

    # ★★★ 修正 1: 静态文件用 ^~ 前缀，优先于正则匹配，避免被上方敏感文件规则误拦
    #    alias 路径必须与 Django STATIC_ROOT 一致
    #    Django settings.py: STATIC_ROOT = BASE_DIR / 'staticfiles'
    #    服务器上即 /www/wwwroot/ifrs17-system/staticfiles/
    #    ⚠️ 首次部署必须执行: python manage.py collectstatic --noinput
    location ^~ /static/ {
        alias /www/wwwroot/ifrs17-system/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 媒体文件（同样用 ^~ 前缀）
    location ^~ /media/ {
        alias /www/wwwroot/ifrs17-system/media/;
        expires 7d;
    }

    # ===== IFRS17 配置结束 =====

    # HTTP反向代理相关配置开始 >>>
    location / {
        # ★★★ 修正 2: 端口必须与 Gunicorn bind 一致（8080）
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★★★ 修正 3: 补充 HTTP/1.1 和 Connection 头，支持 keep-alive
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 上传文件解析超时（openpyxl 解析大 Excel 需要时间）
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # ★★★ 修正 4: 缓冲区设置 — proxy_temp_file_write_size 必须 >= max(proxy_buffer_size, proxy_buffers 单个值)
        #    proxy_buffer_size = 128k, proxy_buffers 单个 = 256k, 最大值 = 256k
        #    所以 proxy_temp_file_write_size 必须 >= 256k
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
    }
    # HTTP反向代理相关配置结束 <<<

    access_log /www/wwwlogs/ifrs17-system.log;
    error_log /www/wwwlogs/ifrs17-system.error.log;
}
