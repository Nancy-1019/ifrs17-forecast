<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFRS17 预测模型系统 — 宝塔面板部署视频教程</title>
<style>
:root {
  --bg: #0f1117;
  --bg-card: #1a1d27;
  --bg-code: #131620;
  --bg-sidebar: #161822;
  --text: #e4e6eb;
  --text-dim: #9ca3af;
  --text-bright: #f8fafc;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --accent-dim: rgba(99,102,241,0.15);
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.15);
  --yellow: #f59e0b;
  --yellow-dim: rgba(245,158,11,0.15);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.15);
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.15);
  --border: #2a2d3a;
  --radius: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  overflow: hidden;
  height: 100vh;
}

/* Layout */
.app {
  display: flex;
  height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 300px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h1 {
  font-size: 16px;
  color: var(--text-bright);
  margin-bottom: 4px;
}

.sidebar-header p {
  font-size: 12px;
  color: var(--text-dim);
}

.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 12px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--green));
  width: 0%;
  transition: width 0.4s ease;
  border-radius: 2px;
}

.step-list {
  flex: 1;
  padding: 12px 0;
}

.step-item {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  cursor: pointer;
  transition: all 0.2s;
  border-left: 3px solid transparent;
  gap: 12px;
}

.step-item:hover {
  background: rgba(99,102,241,0.08);
}

.step-item.active {
  background: var(--accent-dim);
  border-left-color: var(--accent);
}

.step-item.done .step-num {
  background: var(--green);
  color: #fff;
}

.step-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--border);
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
  transition: all 0.2s;
}

.step-item.active .step-num {
  background: var(--accent);
  color: #fff;
}

.step-info {
  flex: 1;
  min-width: 0;
}

.step-title {
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.step-item.active .step-title {
  color: var(--text-bright);
  font-weight: 600;
}

.step-desc {
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Main content */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.content-header {
  padding: 20px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.content-header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.phase-badge {
  background: var(--accent-dim);
  color: var(--accent-hover);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.content-header h2 {
  font-size: 20px;
  color: var(--text-bright);
}

.nav-buttons {
  display: flex;
  gap: 8px;
}

.nav-btn {
  padding: 8px 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent-hover);
}

.nav-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.nav-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.nav-btn.primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.content-body {
  flex: 1;
  overflow-y: auto;
  padding: 32px;
}

.content-section {
  max-width: 900px;
  margin: 0 auto;
}

/* Content elements */
.intro-text {
  font-size: 15px;
  color: var(--text-dim);
  margin-bottom: 24px;
  line-height: 1.8;
}

h3 {
  font-size: 17px;
  color: var(--text-bright);
  margin: 28px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

h3 .icon {
  font-size: 20px;
}

h4 {
  font-size: 14px;
  color: var(--accent-hover);
  margin: 20px 0 8px;
}

p {
  margin-bottom: 12px;
  font-size: 14px;
}

/* Table */
.table-wrap {
  overflow-x: auto;
  margin: 16px 0;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  background: var(--bg-card);
  color: var(--text-bright);
  padding: 10px 16px;
  text-align: left;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

tr:last-child td {
  border-bottom: none;
}

tr:hover td {
  background: rgba(99,102,241,0.05);
}

td code {
  background: var(--bg-code);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--accent-hover);
}

/* Code block */
.code-block {
  background: var(--bg-code);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin: 16px 0;
  overflow: hidden;
}

.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--border);
}

.code-lang {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.copy-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}

.copy-btn:hover {
  border-color: var(--accent);
  color: var(--accent-hover);
}

.copy-btn.copied {
  border-color: var(--green);
  color: var(--green);
}

.code-block pre {
  padding: 16px;
  overflow-x: auto;
  font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
  font-size: 13px;
  line-height: 1.6;
  color: #c9d1d9;
}

.code-block .comment { color: #6a9955; }
.code-block .keyword { color: #c678dd; }
.code-block .string { color: #98c379; }
.code-block .number { color: #d19a66; }

/* Alert boxes */
.alert {
  padding: 16px 20px;
  border-radius: var(--radius);
  margin: 16px 0;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  font-size: 14px;
}

.alert-icon {
  font-size: 18px;
  flex-shrink: 0;
}

.alert-content {
  flex: 1;
}

.alert-title {
  font-weight: 700;
  margin-bottom: 4px;
}

.alert-warning {
  background: var(--yellow-dim);
  border: 1px solid rgba(245,158,11,0.3);
}

.alert-warning .alert-title { color: var(--yellow); }
.alert-warning .alert-icon { color: var(--yellow); }

.alert-danger {
  background: var(--red-dim);
  border: 1px solid rgba(239,68,68,0.3);
}

.alert-danger .alert-title { color: var(--red); }
.alert-danger .alert-icon { color: var(--red); }

.alert-info {
  background: var(--blue-dim);
  border: 1px solid rgba(59,130,246,0.3);
}

.alert-info .alert-title { color: var(--blue); }
.alert-info .alert-icon { color: var(--blue); }

.alert-success {
  background: var(--green-dim);
  border: 1px solid rgba(34,197,94,0.3);
}

.alert-success .alert-title { color: var(--green); }
.alert-success .alert-icon { color: var(--green); }

/* Checklist */
.checklist {
  margin: 16px 0;
}

.checklist-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}

.checklist-item:hover {
  color: var(--text-bright);
}

.checklist-box {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  font-size: 12px;
  color: transparent;
}

.checklist-item.checked .checklist-box {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}

.checklist-item.checked .checklist-text {
  text-decoration: line-through;
  color: var(--text-dim);
}

/* Flow diagram */
.flow-diagram {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin: 24px 0;
  flex-wrap: wrap;
}

.flow-node {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  text-align: center;
  min-width: 120px;
}

.flow-node-icon {
  font-size: 28px;
  margin-bottom: 6px;
}

.flow-node-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-bright);
}

.flow-node-desc {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}

.flow-arrow {
  color: var(--accent);
  font-size: 20px;
  padding: 0 12px;
}

/* Troubleshooting */
.trouble-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin: 12px 0;
  overflow: hidden;
}

.trouble-header {
  padding: 14px 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.2s;
}

.trouble-header:hover {
  background: rgba(99,102,241,0.05);
}

.trouble-q {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-bright);
}

.trouble-toggle {
  color: var(--text-dim);
  transition: transform 0.2s;
  font-size: 12px;
}

.trouble-card.open .trouble-toggle {
  transform: rotate(180deg);
}

.trouble-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.trouble-card.open .trouble-body {
  max-height: 600px;
}

.trouble-content {
  padding: 0 20px 16px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.8;
}

/* Badge */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}

.badge-green { background: var(--green-dim); color: var(--green); }
.badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
.badge-red { background: var(--red-dim); color: var(--red); }
.badge-blue { background: var(--blue-dim); color: var(--blue); }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a3d4a; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 60px; }
  .step-info { display: none; }
  .sidebar-header h1, .sidebar-header p { display: none; }
  .content-body { padding: 16px; }
}

/* Completion screen */
.completion {
  text-align: center;
  padding: 40px 20px;
}

.completion-icon {
  font-size: 64px;
  margin-bottom: 16px;
}

.completion h2 {
  color: var(--green);
  margin-bottom: 8px;
}

.completion p {
  color: var(--text-dim);
  font-size: 15px;
}

/* Step transition animation */
.content-section {
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>IFRS17 宝塔部署教程</h1>
      <p>Django 6.0 + Gunicorn + Nginx</p>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="step-list" id="stepList">
      <!-- Steps will be generated by JS -->
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="content-header">
      <div class="content-header-left">
        <span class="phase-badge" id="phaseBadge">第 1 阶段</span>
        <h2 id="stepTitle">准备工作</h2>
      </div>
      <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← 上一步</button>
        <button class="nav-btn primary" id="nextBtn" onclick="navigate(1)">下一步 →</button>
      </div>
    </div>
    <div class="content-body" id="contentBody">
      <!-- Content will be generated by JS -->
    </div>
  </div>
</div>

<script>
const steps = [
  {
    title: '准备工作',
    desc: '阿里云ECS + 安全组',
    content: `
      <div class="content-section">
        <p class="intro-text">在开始部署之前，需要先准备一台阿里云 ECS 服务器，并开放必要的网络端口。这是整个部署流程的基础。</p>

        <h3><span class="icon">📋</span> 推荐服务器配置</h3>
        <div class="table-wrap">
          <table>
            <tr><th>配置项</th><th>推荐值</th><th>说明</th></tr>
            <tr><td>地域</td><td>华东1（杭州）</td><td>或离用户最近的地域</td></tr>
            <tr><td>实例规格</td><td>2 vCPU / 4 GB</td><td>ecs.c7.large 或同等</td></tr>
            <tr><td>操作系统</td><td><code>Ubuntu 22.04</code></td><td>推荐，宝塔兼容性最好</td></tr>
            <tr><td>系统盘</td><td>40 GB 高效云盘</td><td>足够运行 Django + SQLite</td></tr>
            <tr><td>带宽</td><td>按量计费 5 Mbps</td><td>起步，后续可调整</td></tr>
          </table>
        </div>

        <h3><span class="icon">🔐</span> 安全组端口放行</h3>
        <p>阿里云 ECS 控制台 → 安全组 → 入方向 → 添加规则：</p>
        <div class="table-wrap">
          <table>
            <tr><th>端口</th><th>协议</th><th>源地址</th><th>用途</th></tr>
            <tr><td><code>22</code></td><td>TCP</td><td>0.0.0.0/0</td><td>SSH 远程连接</td></tr>
            <tr><td><code>80</code></td><td>TCP</td><td>0.0.0.0/0</td><td>HTTP 网站访问</td></tr>
            <tr><td><code>443</code></td><td>TCP</td><td>0.0.0.0/0</td><td>HTTPS（配置SSL后）</td></tr>
            <tr><td><code>8888</code></td><td>TCP</td><td>0.0.0.0/0</td><td>宝塔面板入口</td></tr>
          </table>
        </div>

        <div class="alert alert-warning">
          <span class="alert-icon">⚠️</span>
          <div class="alert-content">
            <div class="alert-title">安全提醒</div>
            部署完成后，建议将 8888 端口源地址改为你的办公 IP 白名单，避免面板被暴力破解。
          </div>
        </div>

        <h3><span class="icon">🏗️</span> 部署架构总览</h3>
        <div class="flow-diagram">
          <div class="flow-node">
            <div class="flow-node-icon">🌐</div>
            <div class="flow-node-title">浏览器</div>
            <div class="flow-node-desc">用户访问 :80</div>
          </div>
          <div class="flow-arrow">→</div>
          <div class="flow-node">
            <div class="flow-node-icon">⚡</div>
            <div class="flow-node-title">Nginx</div>
            <div class="flow-node-desc">反向代理 + 静态文件</div>
          </div>
          <div class="flow-arrow">→</div>
          <div class="flow-node">
            <div class="flow-node-icon">🐍</div>
            <div class="flow-node-title">Gunicorn</div>
            <div class="flow-node-desc">:8000 WSGI</div>
          </div>
          <div class="flow-arrow">→</div>
          <div class="flow-node">
            <div class="flow-node-icon">📊</div>
            <div class="flow-node-title">Django</div>
            <div class="flow-node-desc">IFRS17 应用</div>
          </div>
        </div>

        <div class="checklist">
          <div class="checklist-item" onclick="toggleCheck(this)">
            <div class="checklist-box">✓</div>
            <span class="checklist-text">已购买阿里云 ECS 实例</span>
          </div>
          <div class="checklist-item" onclick="toggleCheck(this)">
            <div class="checklist-box">✓</div>
            <span class="checklist-text">已配置安全组放行 22/80/443/8888 端口</span>
          </div>
          <div class="checklist-item" onclick="toggleCheck(this)">
            <div class="checklist-box">✓</div>
            <span class="checklist-text">已记录服务器公网 IP 地址</span>
          </div>
        </div>
      </div>
    `
  },
  {
    title: '安装宝塔面板',
    desc: 'SSH一键安装 + 首次登录',
    content: `
      <div class="content-section">
        <p class="intro-text">通过 SSH 连接到服务器，执行宝塔面板一键安装脚本。安装过程约 3~5 分钟。</p>

        <h3><span class="icon">🔗</span> SSH 登录服务器</h3>
        <div class="code-block">
          <div class="code-header">
            <span class="code-lang">Bash</span>
            <button class="copy-btn" onclick="copyCode(this)">复制</button>
          </div>
          <pre>ssh root@<span style="color:#d19a66">你的公网IP</span></pre>
        </div>

        <h3><span class="icon">📦</span> 一键安装宝塔面板</h3>
        <h4>Ubuntu 22.04（推荐）</h4>
        <div class="code-block">
          <div class="code-header">
            <span class="code-lang">Bash</span>
            <button class="copy-btn" onclick="copyCode(this)">复制</button>
          </div>
          <pre>wget -O install.sh https://download.bt.cn/install/install-ubuntu_6.0.sh && sudo bash install.sh ed8484bec</pre>
        </div>

        <h4>CentOS 7/8</h4>
        <div class="code-block">
          <div class="code-header">
            <span class="code-lang">Bash</span>
            <button class="copy-btn" onclick="copyCode(this)">复制</button>
          </div>
          <pre>yum install -y wget && wget -O install.sh https://download.bt.cn/install/install_6.0.sh && sh install.sh ed8484bec</pre>
        </div>

        <h3><span class="icon">✅</span> 安装完成后</h3>
        <p>终端会显示面板登录信息，<strong>务必保存</strong>：</p>
        <div class="code-block">
          <div class="code-header">
            <span class="code-lang">Output</span>
            <button class="copy-btn" onclick="copyCode(this)">复制</button>
          </div>
          <pre><span style="color:#6a9955">==================================================================</span>
外网面板地址: http://203.0.113.1:8888/abc12345
内网面板地址: http://10.0.0.1:8888/abc12345
username: abcdefgh
password: xxxxxxxxx
<span style="color:#6a9955">==================================================================</span></pre>
        </div>

        <div class="alert alert-info">
          <span class="alert-icon">💡</span>
          <div class="alert-content">
            <div class="alert-title">忘记密码？</div>
            SSH 执行 <code>bt default</code> 即可重新查看面板登录信息。
          </div>

let currentStep = 0;

function renderSidebar() {
  const list = document.getElementById('stepList');
  list.innerHTML = steps.map((step, i) => `
    <div class="step-item ${i === currentStep ? 'active' : ''}" onclick="goToStep(${i})">
      <div class="step-num">${i + 1}</div>
      <div class="step-info">
        <div class="step-title">${step.title}</div>
        <div class="step-desc">${step.desc}</div>
      </div>
    </div>
  `).join('');
  updateProgress();
}

function updateProgress() {
  const progress = ((currentStep + 1) / steps.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('phaseBadge').textContent = `第 ${currentStep + 1} 阶段 / 共 ${steps.length} 阶段`;
  document.getElementById('stepTitle').textContent = steps[currentStep].title;

  const stepItems = document.querySelectorAll('.step-item');
  stepItems.forEach((item, i) => {
    item.classList.toggle('active', i === currentStep);
    if (i < currentStep) item.classList.add('done');
    else item.classList.remove('done');
  });

  document.getElementById('prevBtn').disabled = currentStep === 0;
  const nextBtn = document.getElementById('nextBtn');
  if (currentStep === steps.length - 1) {
    nextBtn.textContent = '完成 ✓';
  } else {
    nextBtn.textContent = '下一步 →';
  }
}

function renderContent() {
  document.getElementById('contentBody').innerHTML = steps[currentStep].content;
  document.querySelector('.content-body').scrollTop = 0;
}

function goToStep(index) {
  if (index >= 0 && index < steps.length) {
    currentStep = index;
    renderSidebar();
    renderContent();
    updateProgress();
  }
}

function navigate(dir) {
  const newIndex = currentStep + dir;
  if (newIndex >= 0 && newIndex < steps.length) {
    goToStep(newIndex);
  } else if (newIndex === steps.length) {
    showCompletion();
  }
}

function showCompletion() {
  document.getElementById('contentBody').innerHTML = `
    <div class="content-section">
      <div class="completion">
        <div class="completion-icon">🎉</div>
        <h2>教程已完成！</h2>
        <p>IFRS17 预测模型系统宝塔面板部署教程全部学习完毕</p>
        <br>
        <div style="text-align:left;max-width:500px;margin:0 auto;">
          <h4 style="color:var(--accent-hover);margin-bottom:12px;">快速参考</h4>
          <div class="table-wrap">
            <table>
              <tr><th>端口</th><th>用途</th><th>对外</th></tr>
              <tr><td>80</td><td>Nginx HTTP</td><td><span class="badge badge-green">是</span></td></tr>
              <tr><td>443</td><td>Nginx HTTPS</td><td><span class="badge badge-green">是</span></td></tr>
              <tr><td>8000</td><td>Gunicorn</td><td><span class="badge badge-red">否</span></td></tr>
              <tr><td>8888</td><td>宝塔面板</td><td><span class="badge badge-yellow">限制IP</span></td></tr>
            </table>
          </div>
        </div>
      </div>
    </div>
  `;
}

function copyCode(btn) {
  const codeBlock = btn.closest('.code-block');
  const pre = codeBlock.querySelector('pre');
  const text = pre.innerText;

  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '已复制 ✓';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '复制';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function toggleCheck(item) {
  item.classList.toggle('checked');
}

function toggleTrouble(card) {
  card.classList.toggle('open');
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

// Init
renderSidebar();
renderContent();
updateProgress();
</script>
