# ============================================================
# IFRS17 nginx 容器配置 — 反向代理 + 静态/媒体直服
# 取代原宝塔 Nginx（容器 nginx 监听 :80）
# ============================================================
upstream ifrs17_web {
    server web:8080;
}

server {
    listen 80;
    server_name _;

    # 上传接口 raw body 最大 50MB（与 DATA_UPLOAD_MAX_MEMORY_SIZE 对齐）
    client_max_body_size 50m;

    # 静态资源（Django collectstatic 收集到 STATIC_ROOT，经共享卷挂载）
    # 引用的 ?v=SYSTEM_VERSION 仅用于浏览器缓存失效，nginx 忽略查询串
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 媒体/上传落盘文件
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
    }

    # 其余请求反代到 Gunicorn；HTML 由 Django NoCacheHTMLMiddleware 置 no-store
    location / {
        proxy_pass http://ifrs17_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
