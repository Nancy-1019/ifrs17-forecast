# ============================================================
# IFRS17 新准则预测模型系统 — 完整 Docker 部署
# 三服务：db(MySQL 8.0) + web(Django+Gunicorn) + nginx(反向代理+静态)
#
# 首次部署步骤（在服务器上）：
#   1) 复制整个 ifrs17-system 目录到服务器
#   2) cp .env.example .env 并填写（尤其 IFRS17_SECRET_KEY、各密码）
#   3) 迁移现有数据：把生产库导出放到 ./mysql/init/ifrs17_dump.sql
#      （在宝塔/原 MySQL 上执行，--databases 会自带 CREATE DATABASE/USE：
#        mysqldump --databases ifrs17 -uroot -p > ifrs17-system/mysql/init/ifrs17_dump.sql）
#   4) 停用宝塔 Nginx（避免与容器 nginx 抢占 :80）：
#      /etc/init.d/nginx stop   （或宝塔面板停用 ifrs17 站点）
#   5) docker compose --env-file .env up -d --build
#
# 说明：
#   - 数据库数据持久化于命名卷 db_data；首次启动会执行 ./mysql/init 下的 SQL
#   - 静态/媒体文件经共享卷 static_volume / media_volume 交给 nginx 直接服务
#   - web 服务 workers 固定为 1（计算进度/结果缓存为进程内全局变量，多 worker 会卡 0%）
# ============================================================

services:
  db:
    image: mysql:8.0
    container_name: ifrs17-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ifrs17
      MYSQL_USER: ifrs17
      MYSQL_PASSWORD: ${IFRS17_DB_PASSWORD}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ifrs17-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ifrs17-web
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DJANGO_SETTINGS_MODULE: ifrs17_core.settings_prod
      IFRS17_SECRET_KEY: ${IFRS17_SECRET_KEY}
      IFRS17_ALLOWED_HOSTS: ${IFRS17_ALLOWED_HOSTS}
      IFRS17_CSRF_TRUSTED_ORIGINS: ${IFRS17_CSRF_TRUSTED_ORIGINS}
      # 指向 compose 内 db 服务（覆盖原有 127.0.0.1 默认值）
      IFRS17_DB_HOST: db
      IFRS17_DB_PORT: "3306"
      IFRS17_DB_NAME: ifrs17
      IFRS17_DB_USER: ifrs17
      IFRS17_DB_PASSWORD: ${IFRS17_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - ifrs17-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ifrs17-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/static:ro
      - media_volume:/usr/share/nginx/media:ro
    depends_on:
      - web
    networks:
      - ifrs17-net

volumes:
  db_data:
  static_volume:
  media_volume:

networks:
  ifrs17-net:
    driver: bridge
